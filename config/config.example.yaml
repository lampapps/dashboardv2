# JABS dashboard v2 configuration. Copy to config/config.yaml and edit.
# Secrets (SMTP login, AWS keys) go in .env, never here. Agents are in agents.yaml.

# IANA timezone used to group days and to display times.
timezone: "America/New_York"

server:
  host: "0.0.0.0"
  port: 5002            # use 5000 once v2 replaces v1
  workers: 2
  threads: 2

# Status badges shown across the top of the dashboard (Uptime Kuma or any image URL).
badges: []
#  - label: "NAS1"
#    image_url: "http://kuma.example.lan/api/badge/13/status?label=NAS1"
#    link: "http://kuma.example.lan/"

storage:
  drive_interval_minutes: 15
  s3_interval_hours: 12     # S3 publishes bucket sizes once a day; listing a big bucket is slow and billable
  aws_region: "us-east-1"   # default CloudWatch/S3 region; override per bucket with `region`
  # Local drives and mounts to sample for storage-over-time charts.
  drives:
    - path: "/"
      label: "Root"
  # S3 buckets (needs AWS credentials in .env). Leave empty to disable.
  #   method: cloudwatch (default) = free daily size per storage class; needs cloudwatch:ListMetrics
  #           and cloudwatch:GetMetricData. list = scans the bucket for sizes per top-level prefix
  #           (needs s3:ListBucket; slower and billable).
  s3_buckets: []
#    - bucket: "example-bucket"
#      label: "Backups"
#      method: cloudwatch
#      region: "us-east-1"

email:
  smtp_server: ""       # set to enable email; credentials: JABS_SMTP_USER / JABS_SMTP_PASS in .env
  smtp_port: 587
  use_tls: true
  from_addr: ""
  to_addrs: []
  digest:
    enabled: true
    schedule: "0 8 * * *"        # 5-field cron expression
  offline_alert:
    enabled: true
    max_alerts: 1                # alerts per outage; 0 = repeat until back online
    repeat_interval_minutes: 60
    send_recovery: true          # also email when the agent is back (only after an alert was sent)

retention:
  runs_days: 30          # raw runs and their events
  rollup_days: 365       # daily job-activity counts
  status_days: 365       # agent up/down history
  storage_days: 365      # storage samples
  log_lines_per_log: 5000
  log_days: 30           # agent log lines older than this are dropped
