<!doctype html>
<html>
<body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #1d2733; max-width: 640px;">
  <h2 style="color: #15803d; margin-bottom: .25rem;">Agent {{ label }} is back</h2>
  <table style="border-collapse: collapse;">
    <tr><td style="padding: 2px 16px 2px 0; color: #5d6b7a;">Host</td><td>{{ host }}</td></tr>
    <tr><td style="padding: 2px 16px 2px 0; color: #5d6b7a;">Offline since</td><td>{{ down_since }}</td></tr>
    <tr><td style="padding: 2px 16px 2px 0; color: #5d6b7a;">Back at</td><td>{{ back_at }}</td></tr>
    <tr><td style="padding: 2px 16px 2px 0; color: #5d6b7a;">Offline for</td><td>{{ down_for }}</td></tr>
  </table>
  <p style="color: #9aa7b4; font-size: 12px;">JABS dashboard, {{ generated }}</p>
</body>
</html>
