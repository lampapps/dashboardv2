{% extends "base.html" %}
{% block title %}Logs - JABS{% endblock %}

{% block content %}
<section class="panel">
  <div class="panel-head">
    <div>
      <h2>Agent logs</h2>
      <div class="sub" id="log-summary"></div>
    </div>
    <div class="filters">
      <label class="sub">Agent <select id="l-agent" class="input" aria-label="Agent"></select></label>
      <label class="sub">Log <select id="l-log" class="input" aria-label="Log"></select></label>
    </div>
  </div>

  <div class="log-controls">
    <div class="chips" id="l-levels" role="group" aria-label="Levels"></div>
    <input id="l-search" class="input" type="search" placeholder="Search lines" aria-label="Search lines" autocomplete="off">
    <label class="check"><input id="l-wrap" type="checkbox"> Wrap</label>
    <button class="btn" type="button" id="l-follow" aria-pressed="true">Follow</button>
    <a class="btn" id="l-download" href="#" download>Download</a>
  </div>

  <div class="log-wrap">
    <button class="btn log-more" type="button" id="l-more" hidden>Load earlier lines</button>
    <div id="log-view" class="log-view" tabindex="0" role="log" aria-label="Log lines"></div>
  </div>
  <p class="sub empty" id="log-empty" hidden></p>
</section>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/logs.js', v=version) }}"></script>
{% endblock %}
