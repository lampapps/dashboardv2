<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JABS{% endblock %}</title>
  <link rel="icon" href="data:,">
  <script src="{{ url_for('static', filename='js/theme-init.js', v=version) }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v=version) }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="{{ url_for('pages.overview') }}">&#123; JABS &#125;</a>
    </div>
    <nav aria-label="Pages">
      <a href="{{ url_for('pages.overview') }}"{% if page == 'overview' %} aria-current="page"{% endif %}>Overview</a>
      <a href="{{ url_for('pages.agents') }}"{% if page == 'agents' %} aria-current="page"{% endif %}>Agents</a>
    </nav>
    <div class="topbar-right">
      <span id="updated" class="sub"></span>
      <button id="theme-toggle" class="btn" type="button">Light mode</button>
    </div>
  </header>
  {% block badges %}{% endblock %}
  <div id="banners"></div>
  <main>{% block content %}{% endblock %}</main>
  <footer class="sub">JABS dashboard v{{ version }}</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
